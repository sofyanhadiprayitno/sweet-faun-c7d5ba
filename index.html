<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RT 04 / RW 12 Perum Taman Buah Sukamantri</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nature: {
                            50: '#f2fcf5',
                            100: '#e1f7e7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js DataLabels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

    <!-- QRCode.js -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <!-- Font Inter & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #printable-area, #printable-area *, #printable-letter, #printable-letter *, #printable-card, #printable-card *, #printable-kk, #printable-kk * { visibility: visible; }
            #printable-area, #printable-card { position: absolute; left: 0; top: 0; width: 100%; border: none !important; box-shadow: none !important; background: white !important; }
            #printable-letter { position: absolute; left: 0; top: 0; width: 210mm; height: 297mm; max-height: 297mm !important; overflow: hidden !important; border: none !important; box-shadow: none !important; background: white !important; padding: 15mm !important; margin: 0 !important; font-size: 11pt !important; page-break-after: always; }
            #printable-kk { position: absolute; left: 0; top: 0; width: 100%; height: 100vh; max-height: 100vh !important; overflow: hidden !important; border: none !important; box-shadow: none !important; background: white !important; page-break-inside: avoid; transform: scale(1); transform-origin: top left; padding: 10mm !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col" x-data="rtApp()">

    <!-- WELCOME / INITIAL LOGIN GATE -->
    <template x-if="!isLoggedIn">
        <div class="fixed inset-0 z-50 bg-nature-900 flex items-center justify-center p-4">
            <div class="absolute inset-0 opacity-25 bg-cover bg-center" :style="'background-image: url(' + settings.welcomeBgImg + ')'"></div>
            <div class="relative z-10 bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl space-y-6">
                <div class="text-center space-y-2">
                    <div class="w-16 h-16 bg-nature-700 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-lg shadow-nature-600/30 overflow-hidden">
                        <template x-if="settings.customLogoUrl">
                            <img :src="settings.customLogoUrl" alt="Logo RT" class="w-full h-full object-cover">
                        </template>
                        <template x-if="!settings.customLogoUrl">
                            <i :class="settings.logoIcon"></i>
                        </template>
                    </div>
                    <div class="space-y-1">
                        <h2 class="text-xl font-extrabold text-slate-900 leading-snug tracking-tight" x-text="settings.appName"></h2>
                        <p class="text-xs font-bold text-nature-700 uppercase tracking-wider" x-text="settings.appSubName"></p>
                        <p class="text-[11px] text-slate-500 font-medium" x-text="settings.appLocation"></p>
                    </div>
                    <p class="text-xs text-slate-500 pt-1">Silakan login dengan username & password Anda untuk mengakses portal warga digital.</p>
                </div>

                <div class="flex justify-center gap-2 border-b border-slate-100 pb-4">
                    <button @click="loginRole = 'pengurus'" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2" :class="loginRole === 'pengurus' ? 'bg-nature-700 text-white shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'">
                        <i class="fa-solid fa-user-tie"></i> Pengurus RT
                    </button>
                    <button @click="loginRole = 'warga'" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2" :class="loginRole === 'warga' ? 'bg-blue-600 text-white shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'">
                        <i class="fa-solid fa-user"></i> Warga
                    </button>
                </div>

                <form @submit.prevent="submitInitialLogin" class="space-y-4 text-xs">
                    <div>
                        <label class="block font-semibold uppercase text-slate-600 mb-1">Username</label>
                        <input type="text" x-model="loginUsername" required placeholder="Masukkan username..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-nature-600 text-sm">
                    </div>
                    <div>
                        <label class="block font-semibold uppercase text-slate-600 mb-1">Password</label>
                        <input type="password" x-model="loginPassword" required placeholder="Masukkan password..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-nature-600 text-sm">
                    </div>

                    <button type="submit" class="w-full bg-nature-700 hover:bg-nature-800 text-white font-semibold py-3.5 rounded-xl text-sm shadow-md transition flex items-center justify-center gap-2 mt-2">
                        <i class="fa-solid fa-right-to-bracket"></i> Masuk ke Dashboard
                    </button>
                </form>
            </div>
        </div>
    </template>

    <!-- MAIN APP WRAPPER (Shown after login) -->
    <template x-if="isLoggedIn">
        <div class="min-h-screen flex flex-col">
            <!-- Marquee Hotline Banner -->
            <div class="bg-nature-900 text-nature-100 text-xs py-2 px-4 shadow-inner">
                <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2 overflow-hidden">
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <span class="bg-nature-600 text-white px-2 py-0.5 rounded-full font-semibold animate-pulse shrink-0">SIAGA RT</span>
                        <div class="overflow-hidden whitespace-nowrap w-full sm:w-[550px]">
                            <div class="inline-block animate-[marquee_20s_linear_infinite]">
                                Hotline Keamanan & Ambulans: <strong x-text="kontakInfo.hotline"></strong> (Idrus Sadi) &bull; Darurat Hubungi Pengurus RT 04 Siap 24 Jam &bull; Layanan Cepat Tanggap Warga Perum Taman Buah Sukamantri
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 text-nature-200 shrink-0">
                        <span><i class="fa-solid fa-location-dot mr-1"></i> <span x-text="kontakInfo.lokasiDetail"></span></span>
                        <span><i class="fa-solid fa-calendar-days mr-1"></i> <span x-text="currentDate"></span></span>
                    </div>
                </div>
            </div>

            <header class="bg-white sticky top-0 z-40 shadow-sm border-b border-slate-100">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col gap-4">
                    <div class="flex items-center justify-between">
                        <!-- Logo & Title -->
                        <div class="flex items-center gap-3 cursor-pointer" @click="changeTab('dashboard')">
                            <div class="w-12 h-12 bg-nature-700 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-nature-600/30 text-xl overflow-hidden">
                                <template x-if="settings.customLogoUrl">
                                    <img :src="settings.customLogoUrl" alt="Logo RT" class="w-full h-full object-cover">
                                </template>
                                <template x-if="!settings.customLogoUrl">
                                    <i :class="settings.logoIcon"></i>
                                </template>
                            </div>
                            <div>
                                <h1 class="font-bold text-base sm:text-lg text-slate-900 tracking-tight leading-snug" x-text="settings.appName"></h1>
                                <p class="text-xs text-nature-700 font-medium" x-text="settings.appSubName"></p>
                            </div>
                        </div>

                        <!-- Auth Profile / Login Button -->
                        <div class="flex items-center gap-3">
                            <template x-if="currentUser">
                                <div class="flex items-center gap-3 bg-slate-100 px-3 py-1.5 rounded-2xl">
                                    <div class="w-9 h-9 rounded-xl bg-nature-700 text-white flex items-center justify-center font-bold text-sm">
                                        <i :class="currentUser.role === 'pengurus' ? 'fa-solid fa-user-tie' : 'fa-solid fa-user'"></i>
                                    </div>
                                    <div class="hidden sm:block text-left text-xs">
                                        <p class="font-bold text-slate-900" x-text="currentUser.nama"></p>
                                        <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold" :class="currentUser.role === 'pengurus' ? 'bg-emerald-100 text-nature-800' : 'bg-blue-100 text-blue-800'" x-text="currentUser.role === 'pengurus' ? 'Pengurus RT' : 'Warga'"></span>
                                    </div>
                                    <button @click="logout()" class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg transition" title="Keluar">
                                        <i class="fa-solid fa-right-from-bracket"></i>
                                    </button>
                                </div>
                            </template>
                            <template x-if="!currentUser">
                                <button @click="openLoginModal()" class="bg-nature-700 hover:bg-nature-800 text-white px-4 py-2.5 rounded-2xl font-semibold text-xs shadow-md transition flex items-center gap-2">
                                    <i class="fa-solid fa-right-to-bracket"></i> Login
                                </button>
                            </template>

                            <!-- Mobile Menu Toggle -->
                            <button @click="mobileMenuOpen = !mobileMenuOpen" class="lg:hidden p-2.5 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200">
                                <i class="fa-solid fa-bars text-lg"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Navigation Menu -->
                    <nav class="hidden lg:flex items-center gap-1.5 bg-slate-100 p-1.5 rounded-2xl w-fit">
                        <template x-for="tab in tabs" :key="tab.id">
                            <button @click="changeTab(tab.id)"
                                :class="activeTab === tab.id ? 'bg-nature-700 text-white shadow-md' : 'text-slate-600 hover:text-nature-700'"
                                class="px-3.5 py-2 rounded-xl text-xs font-semibold transition-all flex items-center gap-2">
                                <i :class="tab.icon"></i>
                                <span x-text="tab.name"></span>
                            </button>
                        </template>
                    </nav>
                </div>

                <!-- Mobile Drawer -->
                <div x-show="mobileMenuOpen" @click.away="mobileMenuOpen = false" class="lg:hidden bg-white border-b border-slate-200 px-4 pt-2 pb-4 space-y-1">
                    <template x-for="tab in tabs" :key="tab.id">
                        <button @click="changeTab(tab.id); mobileMenuOpen = false;"
                            :class="activeTab === tab.id ? 'bg-nature-50 text-nature-700 font-bold' : 'text-slate-700'"
                            class="w-full text-left px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-3">
                            <i :class="tab.icon + ' w-5 text-nature-600'"></i>
                            <span x-text="tab.name"></span>
                        </button>
                    </template>
                </div>
            </header>

            <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

                <!-- ==================== DASHBOARD TAB ==================== -->
                <div x-show="activeTab === 'dashboard'" class="space-y-8">
                    <div class="relative rounded-3xl bg-gradient-to-r from-nature-800 via-nature-700 to-emerald-600 text-white p-8 sm:p-12 overflow-hidden shadow-xl shadow-nature-900/10 h-64 flex items-center justify-center text-center">
                        <div class="absolute inset-0 opacity-40 bg-cover bg-center" :style="'background-image: url(' + settings.menuBanners.dashboard + ')'"></div>
                        <div class="relative z-10 space-y-2 flex flex-col items-center justify-center text-center">
                            <span class="bg-white/20 text-white px-3.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider inline-block">Dashboard Utama</span>
                            <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Selamat Datang di Portal Warga RT 04</h2>
                            <p class="text-xs sm:text-sm text-nature-100 max-w-xl mx-auto">Pusat informasi, kependudukan, administrasi surat, dan transparansi keuangan warga Perum Taman Buah Sukamantri.</p>
                        </div>
                    </div>

                    <!-- Stats Grid -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6">
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-4">
                            <div class="w-14 h-14 rounded-2xl bg-emerald-100 text-nature-700 flex items-center justify-center text-2xl font-bold"><i class="fa-solid fa-house-chimney"></i></div>
                            <div>
                                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Jumlah KK</p>
                                <h4 class="text-2xl font-extrabold text-slate-900 mt-1" x-text="stats.kk"></h4>
                                <span class="text-[10px] text-nature-700 font-semibold bg-nature-50 px-2 py-0.5 rounded-full">Kepala Keluarga</span>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-4">
                            <div class="w-14 h-14 rounded-2xl bg-blue-100 text-blue-700 flex items-center justify-center text-2xl font-bold"><i class="fa-solid fa-users"></i></div>
                            <div>
                                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Warga</p>
                                <h4 class="text-2xl font-extrabold text-slate-900 mt-1" x-text="stats.total"></h4>
                                <span class="text-[10px] text-blue-700 font-semibold bg-blue-50 px-2 py-0.5 rounded-full">Jiwa Terdaftar</span>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-4">
                            <div class="w-14 h-14 rounded-2xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-2xl font-bold"><i class="fa-solid fa-mars"></i></div>
                            <div>
                                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Laki-Laki</p>
                                <h4 class="text-2xl font-extrabold text-slate-900 mt-1" x-text="stats.laki"></h4>
                                <span class="text-[10px] text-indigo-700 font-semibold bg-indigo-50 px-2 py-0.5 rounded-full">Jiwa</span>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-4">
                            <div class="w-14 h-14 rounded-2xl bg-pink-100 text-pink-700 flex items-center justify-center text-2xl font-bold"><i class="fa-solid fa-venus"></i></div>
                            <div>
                                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Perempuan</p>
                                <h4 class="text-2xl font-extrabold text-slate-900 mt-1" x-text="stats.perempuan"></h4>
                                <span class="text-[10px] text-pink-700 font-semibold bg-pink-50 px-2 py-0.5 rounded-full">Jiwa</span>
                            </div>
                        </div>
                    </div>

                    <!-- Charts Section -->
                    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100 space-y-6">
                        <div class="border-b border-slate-100 pb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                            <div>
                                <h3 class="text-xl font-bold text-slate-900">Statistik & Demografi Warga RT 04 / RW 12</h3>
                                <p class="text-sm text-slate-500 mt-0.5">Tersinkronisasi otomatis secara real-time dengan database Data Warga (Angka & Persentase)</p>
                            </div>
                            <span class="bg-emerald-50 text-nature-700 text-xs font-semibold px-3 py-1 rounded-full"><i class="fa-solid fa-rotate mr-1"></i> Live Sync Active</span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pt-4">
                            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200/60 flex flex-col justify-between">
                                <div><h4 class="font-bold text-slate-800 text-sm mb-1"><i class="fa-solid fa-people-arrows text-nature-600 mr-2"></i> Statistik Kelompok Usia</h4><p class="text-xs text-slate-500 mb-4">Distribusi usia warga (Balita s/d Lansia)</p></div>
                                <div class="w-full h-64 flex items-center justify-center"><canvas id="chartUsiaGroup"></canvas></div>
                            </div>
                            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200/60 flex flex-col justify-between">
                                <div><h4 class="font-bold text-slate-800 text-sm mb-1"><i class="fa-solid fa-graduation-cap text-nature-600 mr-2"></i> Statistik Pendidikan</h4><p class="text-xs text-slate-500 mb-4">Tingkat pendidikan terakhir warga</p></div>
                                <div class="w-full h-64 flex items-center justify-center"><canvas id="chartPendidikan"></canvas></div>
                            </div>
                            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200/60 flex flex-col justify-between">
                                <div><h4 class="font-bold text-slate-800 text-sm mb-1"><i class="fa-solid fa-briefcase text-nature-600 mr-2"></i> Statistik Pekerjaan</h4><p class="text-xs text-slate-500 mb-4">Mata pencaharian warga RT 04</p></div>
                                <div class="w-full h-64 flex items-center justify-center"><canvas id="chartPekerjaan"></canvas></div>
                            </div>
                            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200/60 flex flex-col justify-between">
                                <div><h4 class="font-bold text-slate-800 text-sm mb-1"><i class="fa-solid fa-house-user text-nature-600 mr-2"></i> Status Tempat Tinggal</h4><p class="text-xs text-slate-500 mb-4">Domisili & status kependudukan</p></div>
                                <div class="w-full h-64 flex items-center justify-center"><canvas id="chartStatusTinggal"></canvas></div>
                            </div>
                            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200/60 flex flex-col justify-between">
                                <div><h4 class="font-bold text-slate-800 text-sm mb-1"><i class="fa-solid fa-place-of-worship text-nature-600 mr-2"></i> Statistik Agama</h4><p class="text-xs text-slate-500 mb-4">Kepercayaan / agama warga</p></div>
                                <div class="w-full h-64 flex items-center justify-center"><canvas id="chartAgama"></canvas></div>
                            </div>
                            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200/60 flex flex-col justify-between">
                                <div><h4 class="font-bold text-slate-800 text-sm mb-1"><i class="fa-solid fa-car text-nature-600 mr-2"></i> Kepemilikan Kendaraan</h4><p class="text-xs text-slate-500 mb-4">Jumlah motor & mobil per KK</p></div>
                                <div class="w-full h-64 flex items-center justify-center"><canvas id="chartKendaraan"></canvas></div>
                            </div>
                            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200/60 flex flex-col justify-between">
                                <div><h4 class="font-bold text-slate-800 text-sm mb-1"><i class="fa-solid fa-bolt text-nature-600 mr-2"></i> Voltase Listrik Rumah</h4><p class="text-xs text-slate-500 mb-4">Daya listrik PLN terpasang</p></div>
                                <div class="w-full h-64 flex items-center justify-center"><canvas id="chartListrik"></canvas></div>
                            </div>
                            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200/60 flex flex-col justify-between">
                                <div><h4 class="font-bold text-slate-800 text-sm mb-1"><i class="fa-solid fa-wifi text-nature-600 mr-2"></i> Penggunaan Internet</h4><p class="text-xs text-slate-500 mb-4">Provider internet warga</p></div>
                                <div class="w-full h-64 flex items-center justify-center"><canvas id="chartInternet"></canvas></div>
                            </div>
                            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200/60 lg:col-span-1 flex flex-col justify-between">
                                <div><h4 class="font-bold text-slate-800 text-sm mb-1"><i class="fa-solid fa-droplet text-nature-600 mr-2"></i> Sumber Air Rumah Tangga</h4><p class="text-xs text-slate-500 mb-4">PAM, sumur bor, atau air bersih</p></div>
                                <div class="w-full h-64 flex items-center justify-center"><canvas id="chartAir"></canvas></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ==================== DATA WARGA TAB ==================== -->
                <div x-show="activeTab === 'warga'" class="space-y-6">
                    <div class="relative rounded-3xl overflow-hidden h-40 bg-nature-900 text-white p-6 flex items-center justify-center text-center">
                        <div class="absolute inset-0 opacity-30 bg-cover bg-center" :style="'background-image: url(' + settings.menuBanners.warga + ')'"></div>
                        <div class="relative z-10 space-y-1 flex flex-col items-center justify-center text-center">
                            <span class="bg-white/20 text-white px-3 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wider inline-block">Database Kependudukan</span>
                            <h2 class="text-xl sm:text-2xl font-extrabold mt-1">Data Warga & Kartu Keluarga</h2>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100 space-y-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded-2xl">
                                <button @click="wargaSubTab = 'tabel'" :class="wargaSubTab === 'tabel' ? 'bg-nature-700 text-white shadow' : 'text-slate-600 hover:text-nature-700'" class="px-4 py-2 rounded-xl text-xs font-semibold transition">Daftar Warga</button>
                                <button @click="wargaSubTab = 'kk'" :class="wargaSubTab === 'kk' ? 'bg-nature-700 text-white shadow' : 'text-slate-600 hover:text-nature-700'" class="px-4 py-2 rounded-xl text-xs font-semibold transition">Daftar KK</button>
                            </div>
                            <div>
                                <template x-if="canManageData()">
                                    <button @click="openAddResidentModal()" class="bg-nature-700 hover:bg-nature-800 text-white px-5 py-3 rounded-2xl font-semibold text-sm shadow-md transition flex items-center gap-2">
                                        <i class="fa-solid fa-user-plus"></i> Tambah Warga Baru
                                    </button>
                                </template>
                                <template x-if="!canManageData()">
                                    <div class="bg-amber-50 text-amber-800 text-xs font-semibold px-4 py-2.5 rounded-2xl border border-amber-200 flex items-center gap-2">
                                        <i class="fa-solid fa-lock"></i> Mode Warga (Read-Only)
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- TABEL WARGA -->
                        <div x-show="wargaSubTab === 'tabel'" class="space-y-4">
                            <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">

                            else if (countMembers === 3) this.residentForm.hub = 'Anak 2';
                            else if (countMembers === 4) this.residentForm.hub = 'Anak 3';

                initCharts() {
                    if (typeof Chart === 'undefined') return;

                    // 1. Usia Group
                    const elUsia = document.getElementById('chartUsiaGroup');
                    if (elUsia) {
                        if (window.myChartUsia) window.myChartUsia.destroy();
                        const balita = this.residents.filter(r => r.usia <= 5).length;
                        const anak = this.residents.filter(r => r.usia > 5 && r.usia <= 17).length;
                        const dewasa = this.residents.filter(r => r.usia > 17 && r.usia <= 55).length;
                        const lansia = this.residents.filter(r => r.usia > 55).length;

                        window.myChartUsia = new Chart(elUsia, {
                            type: 'doughnut',
                            data: {
                                labels: ['Balita (0-5)', 'Anak (6-17)', 'Dewasa (18-55)', 'Lansia (>55)'],
                                datasets: [{ data: [balita, anak, dewasa, lansia], backgroundColor: ['#34d399', '#60a5fa', '#f59e0b', '#ec4899'] }]
                            },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } }
                        });
                    }

                    // 2. Pendidikan
                    const elEdu = document.getElementById('chartPendidikan');
                    if (elEdu) {
                        if (window.myChartEdu) window.myChartEdu.destroy();
                        const sd = this.residents.filter(r => r.pendidikan === 'SD').length;
                        const smp = this.residents.filter(r => r.pendidikan === 'SMP').length;
                        const sma = this.residents.filter(r => r.pendidikan === 'SMA').length;
                        const d3s1 = this.residents.filter(r => r.pendidikan === 'D3/S1').length;
                        const s2s3 = this.residents.filter(r => r.pendidikan === 'S2/S3').length;

                        window.myChartEdu = new Chart(elEdu, {
                            type: 'bar',
                            data: {
                                labels: ['SD', 'SMP', 'SMA', 'D3/S1', 'S2/S3'],
                                datasets: [{ label: 'Jumlah', data: [sd, smp, sma, d3s1, s2s3], backgroundColor: '#15803d', borderRadius: 8 }]
                            },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { precision: 0 } } } }
                        });
                    }

                    // 3. Pekerjaan
                    const elJob = document.getElementById('chartPekerjaan');
                    if (elJob) {
                        if (window.myChartJob) window.myChartJob.destroy();
                        const pns = this.residents.filter(r => r.pekerjaan.toLowerCase().includes('pns')).length;
                        const swasta = this.residents.filter(r => r.pekerjaan.toLowerCase().includes('swasta')).length;
                        const wira = this.residents.filter(r => r.pekerjaan.toLowerCase().includes('wira')).length;
                        const lainnya = this.residents.length - (pns + swasta + wira);

                        window.myChartJob = new Chart(elJob, {
                            type: 'pie',
                            data: {
                                labels: ['PNS', 'Karyawan Swasta', 'Wiraswasta', 'Lainnya / Pelajar'],
                                datasets: [{ data: [pns, swasta, wira, lainnya], backgroundColor: ['#3b82f6', '#10b981', '#f97316', '#8b5cf6'] }]
                            },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } }
                        });
                    }

                    // 4. Status Tinggal
                    const elStatus = document.getElementById('chartStatusTinggal');
                    if (elStatus) {
                        if (window.myChartStatus) window.myChartStatus.destroy();
                        const tetap = this.residents.filter(r => r.status === 'Tetap').length;
                        const kontrak = this.residents.filter(r => r.status === 'Kontrak').length;
                        window.myChartStatus = new Chart(elStatus, {
                            type: 'doughnut',
                            data: {
                                labels: ['Warga Tetap', 'Warga Kontrak'],
                                datasets: [{ data: [tetap, kontrak], backgroundColor: ['#059669', '#38bdf8'] }]
                            },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } }
                        });
                    }

                    // 5. Agama
                    const elAgama = document.getElementById('chartAgama');
                    if (elAgama) {
                        if (window.myChartAgama) window.myChartAgama.destroy();
                        const islam = this.residents.filter(r => r.agama === 'Islam').length;
                        const kristen = this.residents.filter(r => r.agama === 'Kristen' || r.agama === 'Katholik').length;
                        const lainnya = this.residents.length - (islam + kristen);
                        window.myChartAgama = new Chart(elAgama, {
                            type: 'pie',
                            data: {
                                labels: ['Islam', 'Kristen / Katholik', 'Lainnya'],
                                datasets: [{ data: [islam, kristen, lainnya], backgroundColor: ['#047857', '#fbbf24', '#a855f7'] }]
                            },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } }
                        });
                    }

                    // 6. Kendaraan
                    const elKend = document.getElementById('chartKendaraan');
                    if (elKend) {
                        if (window.myChartKend) window.myChartKend.destroy();
                        const motor = this.residents.filter(r => r.kendaraan.toLowerCase().includes('motor')).length;
                        const mobil = this.residents.filter(r => r.kendaraan.toLowerCase().includes('mobil')).length;
                        window.myChartKend = new Chart(elKend, {
                            type: 'bar',
                            data: {
                                labels: ['Motor Pemilik', 'Mobil Pemilik'],
                                datasets: [{ label: 'Jumlah KK', data: [motor, mobil], backgroundColor: '#d97706', borderRadius: 8 }]
                            },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { precision: 0 } } } }
                        });
                    }

                    // 7. Listrik
                    const elListrik = document.getElementById('chartListrik');
                    if (elListrik) {
                        if (window.myChartListrik) window.myChartListrik.destroy();
                        const v450 = this.residents.filter(r => r.listrik === '450VA').length;
                        const v900 = this.residents.filter(r => r.listrik === '900VA').length;
                        const v1300 = this.residents.filter(r => r.listrik === '1300VA').length;
                        const v2200 = this.residents.filter(r => r.listrik === '2200VA+').length;
                        window.myChartListrik = new Chart(elListrik, {
                            type: 'doughnut',
                            data: {
                                labels: ['450VA', '900VA', '1300VA', '2200VA+'],
                                datasets: [{ data: [v450, v900, v1300, v2200], backgroundColor: ['#f87171', '#fb923c', '#4ade80', '#60a5fa'] }]
                            },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } }
                        });
                    }

                    // 8. Internet
                    const elNet = document.getElementById('chartInternet');
                    if (elNet) {
                        if (window.myChartNet) window.myChartNet.destroy();
                        const indihome = this.residents.filter(r => r.internet === 'IndiHome').length;
                        const firstmedia = this.residents.filter(r => r.internet === 'FirstMedia').length;
                        const lainnya = this.residents.length - (indihome + firstmedia);
                        window.myChartNet = new Chart(elNet, {
                            type: 'pie',
                            data: {
                                labels: ['IndiHome', 'FirstMedia', 'Lainnya / Seluler'],
                                datasets: [{ data: [indihome, firstmedia, lainnya], backgroundColor: ['#ec4899', '#8b5cf6', '#06b6d4'] }]
                            },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } }
                        });
                    }

                    // 9. Air
                    const elAir = document.getElementById('chartAir');
                    if (elAir) {
                        if (window.myChartAir) window.myChartAir.destroy();
                        const pam = this.residents.filter(r => r.air.toLowerCase().includes('pam')).length;
                        const sumur = this.residents.filter(r => r.air.toLowerCase().includes('sumur')).length;
                        window.myChartAir = new Chart(elAir, {
                            type: 'bar',
                            data: {
                                labels: ['PAM / AETRA', 'Sumur Bor'],
                                datasets: [{ label: 'Jumlah', data: [pam, sumur], backgroundColor: '#0284c7', borderRadius: 8 }]
                            },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { precision: 0 } } } }
                        });
                    }
                }
            }
        }
    </script>
</body>
</html>
